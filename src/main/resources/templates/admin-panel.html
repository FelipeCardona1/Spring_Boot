<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administración | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/admin}">Gestión</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/Cliente/listar}">Clientes</a>
                <a class="nav-link" th:href="@{/producto/stock}">Productos</a>
                <a class="nav-link active" th:href="@{/admin}">Solicitudes</a>
                <!-- Cerrar sesión envía un POST protegido por CSRF. -->
                <form th:action="@{/logout}" method="post" class="d-flex ms-lg-3">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div class="page-heading">
                <p class="eyebrow mb-2">Administración</p>
                <h1 class="h2 mb-1">Solicitudes de Registro</h1>
                <p class="text-secondary mb-0">Lista de usuarios pendientes de aprobación en la plataforma.</p>
            </div>
        </div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="table-panel">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Correo</th>
                            <th>Fecha</th>
                            <th>Decisión</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="solicitud : ${solicitudes}">
                            <td class="fw-semibold" th:text="${solicitud.nombre}"></td>
                            <!-- Muestra el apellido incluido en la solicitud. -->
                            <td th:text="${solicitud.apellido}"></td>
                            <td th:text="${solicitud.email}"></td>
                            <td th:text="${#dates.format(solicitud.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <!-- El formulario envía el rol CLIENTE para esta solicitud -->
                                <form th:action="@{/admin/aprobar/{id}(id=${solicitud.id})}" method="post"
                                    class="d-inline">
                                    <input type="hidden" name="rol" value="CLIENTE">
                                    <button type="submit" class="btn btn-sm btn-success">
                                        Aprobar como cliente
                                    </button>
                                </form>

                                <!-- Este formulario envía el rol ADMIN -->
                                <form th:action="@{/admin/aprobar/{id}(id=${solicitud.id})}" method="post"
                                    class="d-inline">
                                    <input type="hidden" name="rol" value="ADMIN">
                                    <button type="submit" class="btn btn-sm btn-warning">
                                        Aprobar como administrador
                                    </button>
                                </form>

                                <!-- Esta ruta rechaza la solicitud -->
                                <form th:action="@{/admin/rechazar/{id}(id=${solicitud.id})}" method="post"
                                    class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        Rechazar
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(solicitudes)}">
                            <td class="empty-state" colspan="4">No hay solicitudes pendientes en este momento.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
