<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | Gestión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/catalogo}">Gestión</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/catalogo}">Productos</a>
                <a class="nav-link active" th:href="@{/cliente/perfil}">Mi perfil</a>

                <form th:action="@{/logout}" method="post" class="d-flex ms-lg-3">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="h2 mb-4">Mis datos personales</h1>

        <!-- Estos mensajes los usaremos al implementar el guardado. -->
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="form-panel mx-auto">
            <!-- El siguiente paso implementará el POST /cliente/perfil. -->
            <form th:action="@{/cliente/perfil}" method="post">

                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre" name="nombre" type="text" th:value="${cliente.nombre}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="apellido">Apellido</label>
                    <input class="form-control" id="apellido" name="apellido" type="text" th:value="${cliente.apellido}"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <input class="form-control" id="email" name="email" type="email" th:value="${cliente.email}"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar cambios
                </button>

                <a class="btn btn-outline-secondary" th:href="@{/catalogo}">
                    Cancelar
                </a>
            </form>
        </div>
    </main>
</body>

</html>
