<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Factura | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/catalogo}">Gestión</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/catalogo}">Volver al catálogo</a>

                <form th:action="@{/logout}" method="post" class="d-flex ms-lg-3">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="h2 mb-4">Factura de compra</h1>

        <section class="table-panel p-4 mb-4">
            <p>
                <strong>Factura:</strong>
                <span th:text="${factura.encabezado.id}"></span>
            </p>
            <p>
                <strong>Fecha:</strong>
                <span th:text="${factura.encabezado.fecha}"></span>
            </p>
            <p class="mb-0">
                <strong>Cliente:</strong>
                <span th:text="${factura.encabezado.cliente.nombre}"></span>
                <span th:text="${factura.encabezado.cliente.apellido}"></span>
            </p>
        </section>

        <div class="table-panel">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalle : ${factura.detalles}">
                            <td th:text="${detalle.producto.nombre}"></td>
                            <td th:text="${detalle.cantidad}"></td>
                            <td th:text="${detalle.precioUnitario}"></td>
                            <td th:text="${detalle.valor}"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3" class="text-end">Total</th>
                            <th th:text="${factura.encabezado.total}"></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
