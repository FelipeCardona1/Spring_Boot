<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="d-flex flex-column min-vh-100 justify-content-center py-5">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <div class="text-center mb-4">
                    <p class="eyebrow mb-2">Sistema de Gestión</p>
                    <h1 class="h3 fw-bold mb-1">Crear Cuenta</h1>
                    <p class="text-secondary small mb-0">Ingresa tus datos para registrarte en la plataforma.</p>
                </div>

                <!-- Mensaje de error (si aplica) -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
                    <span th:text="${error}">Error al registrar el usuario.</span>
                </div>

                <!-- Mensaje de éxito (si aplica) -->
                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show text-center"
                    role="alert">
                    <span th:text="${mensaje}">Registro realizado con éxito.</span>
                </div>

                <div class="form-panel mx-auto w-100">
                    <form th:action="@{/registro}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input class="form-control" id="nombre" name="nombre" type="text" placeholder="Tu nombre"
                                required autofocus>
                        </div>

                        <!-- El apellido se envía con el nombre de parámetro que espera el controlador. -->
                        <div class="mb-3">
                            <label class="form-label" for="apellido">Apellido</label>
                            <input class="form-control" id="apellido" name="apellido" type="text"
                                placeholder="Tu apellido" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Correo electrónico</label>
                            <input class="form-control" id="email" name="email" type="email"
                                placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">Contraseña</label>
                            <input class="form-control" id="password" name="password" type="password"
                                placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </div>
                        <!--Envia el formulario al metodo POST /registro-->
                        <div class="d-grid gap-2 mb-3">
                            <button class="btn btn-primary py-2" type="submit">Registrarse</button>
                        </div>

                        <div class="text-center">
                            <span class="small text-secondary">¿Ya tienes una cuenta? </span>
                            <a th:href="@{/login}" class="small text-decoration-none">Iniciar sesión</a>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </main>

</body>

</html>
