<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo | Gestión</title>

    <!-- Estilos que ya usan las otras vistas del proyecto -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/catalogo}">Gestión</a>

            <div class="navbar-nav ms-auto">
                <!-- El cliente solo consulta el catálogo -->
                <a class="nav-link active" th:href="@{/catalogo}">Productos</a>

                <!-- El formulario permite que Spring Security cierre la sesión -->
                <form th:action="@{/logout}" method="post" class="d-flex ms-lg-3">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="h2 mb-4">Catálogo de productos</h1>

        <div class="table-panel">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Disponibles</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Thymeleaf crea una fila por cada producto enviado por el controlador -->
                        <tr th:each="producto : ${productos}">
                            <td class="fw-semibold" th:text="${producto.nombre}"></td>
                            <td th:text="${producto.descripcion}"></td>
                            <td th:text="${producto.precio}"></td>
                            <td th:text="${producto.stock}"></td>
                        </tr>

                        <!-- Este mensaje aparece cuando la lista está vacía -->
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="4" class="empty-state">
                                No hay productos disponibles.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
