<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
</head>
<body>
    <h1 th:text="${titulo}"></h1>

    <form th:action="@{/producto/formulario}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required>

        <label>Descripcion:</label>
        <input type="text" th:field="*{descripcion}" required>

        <label>Precio:</label>
        <input type="number" th:field="*{precio}" min="0" step="0.01" required>

        <label>Stock:</label>
        <input type="number" th:field="*{stock}" min="0" required>

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/producto/listar}">Volver</a>
</body>
</html>
