<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Gestión'">Formulario de Producto | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/Cliente/listar}">Gestión</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/Cliente/listar}">Clientes</a>
                <a class="nav-link" th:href="@{/producto/stock}">Productos</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="page-heading mb-4">
            <p class="eyebrow mb-2">Productos</p>
            <h1 class="h2 mb-1" th:text="${titulo}">Formulario de Producto</h1>
            <p class="text-secondary mb-0">Registra el producto y sus existencias.</p>
        </div>

        <div class="form-panel">
            <form th:action="@{/producto/formulario}" th:object="${producto}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" id="nombre" type="text" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <input class="form-control" id="descripcion" type="text" th:field="*{descripcion}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="precio">Precio</label>
                        <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="precio" type="number" th:field="*{precio}" min="0" step="0.01" required></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="stock">Stock</label>
                        <input class="form-control" id="stock" type="number" th:field="*{stock}" min="0" required>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">Guardar producto</button>
                    <a class="btn btn-outline-secondary" th:href="@{/producto/stock}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
