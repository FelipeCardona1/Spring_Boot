<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Gestión'">Productos | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/Cliente/listar}">Gestión</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/Cliente/listar}">Clientes</a>
                <a class="nav-link active" th:href="@{/producto/stock}">Productos</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div class="page-heading">
                <p class="eyebrow mb-2">Inventario</p>
                <h1 class="h2 mb-1" th:text="${titulo}">Listar Productos</h1>
                <p class="text-secondary mb-0">Consulta y actualiza los productos disponibles.</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-success" th:href="@{/Cliente/listar}">Registrar cliente</a>
                <a class="btn btn-primary" th:href="@{/producto/formulario}">+ Crear producto</a>
            </div>
        </div>

        <div class="table-panel">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}">
                            <td class="text-secondary" th:text="${producto.id}"></td>
                            <td class="fw-semibold" th:text="${producto.nombre}"></td>
                            <td th:text="${producto.descripcion}"></td>
                            <td th:text="${producto.precio}"></td>
                            <td><span class="badge text-bg-light" th:text="${producto.stock}"></span></td>
                            <td class="text-end text-nowrap">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/producto/formulario/{id}(id=${producto.id})}">Editar</a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{/producto/eliminar/{id}(id=${producto.id})}">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}"><td class="empty-state" colspan="6">Todavía no hay productos registrados.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
